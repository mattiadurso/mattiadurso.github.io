<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex">

    <title>Page not found · Mattia D'Urso</title>

    <!-- Forgive case, trailing slashes and long names on the short links and project pages
         (/GH, /cv/, /github → /gh). Only redirects when the target differs, so no loops. -->
    <script>
      var links = {
        gh: '/gh', github: '/gh',
        hf: '/hf', huggingface: '/hf',
        ln: '/ln', linkedin: '/ln',
        scholar: '/scholar',
        cv: '/cv', resume: '/cv',
        terrasky3d: '/terrasky3d',
        epo: '/epo/', sandesc: '/sandesc/'
      };
      var key = location.pathname.toLowerCase().replace(/^\/+|\/+$/g, '');
      if (links.hasOwnProperty(key) && links[key] !== location.pathname) location.replace(links[key]);

      // /epala (the elisabettapala.com concept, taken down) gets a "demo is over" variant
      if (key === 'epala' || key.indexOf('epala/') === 0) {
        document.documentElement.className += ' demo-over';
        document.title = "Demo is over · Mattia D'Urso";
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">

    <link rel="stylesheet" type="text/css" href="/stylesheet.css">

    <style>
      .notfound {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* A lost camera looking around for the page */
      .lost-cam {
        width: 180px;
        margin-bottom: 1.5rem;
        overflow: visible;
      }
      .lost-cam .body  { transform-origin: 90px 70px; animation: wobble 3s ease-in-out infinite; }
      .lost-cam .pupil { animation: look 3s ease-in-out infinite; }
      .lost-cam .lens  { transform-origin: 90px 66px; animation: blink 3s infinite; }
      .lost-cam .huh   { transform-origin: 150px 30px; animation: huh 3s ease-in-out infinite; }

      @keyframes wobble {
        0%, 100% { transform: rotate(-4deg); }
        50%      { transform: rotate(4deg); }
      }
      @keyframes look {
        0%, 100% { transform: translateX(-8px); }
        50%      { transform: translateX(8px); }
      }
      @keyframes blink {
        0%, 46%, 54%, 100% { transform: scaleY(1); }
        50%                { transform: scaleY(0.1); }
      }
      @keyframes huh {
        0%, 100% { transform: translateY(0) rotate(-8deg); opacity: 0.4; }
        50%      { transform: translateY(-6px) rotate(8deg); opacity: 1; }
      }

      /* "Demo is over" variant (set from the head script): the camera dozes off, lens shut, z's drifting up */
      .demo-only, .demo-over .notfound-only { display: none; }
      .demo-over .demo-only { display: revert; }
      .demo-over .lost-cam .body  { animation: doze 4s ease-in-out infinite; }
      .demo-over .lost-cam .lens  { display: none; }
      .lost-cam .zz { transform-origin: 150px 30px; animation: zz 4s ease-in-out infinite; }

      @keyframes doze {
        0%, 100% { transform: rotate(-3deg) translateY(0); }
        50%      { transform: rotate(-3deg) translateY(3px); }
      }
      @keyframes zz {
        0%      { transform: translate(-6px, 6px); opacity: 0; }
        30%, 70% { opacity: 1; }
        100%    { transform: translate(6px, -10px); opacity: 0; }
      }

      /* the site-wide reduced-motion rule would make these infinite loops flicker; stop them */
      @media (prefers-reduced-motion: reduce) {
        .lost-cam .body, .lost-cam .pupil, .lost-cam .lens, .lost-cam .huh,
        .demo-over .lost-cam .body, .lost-cam .zz { animation: none; }
      }
    </style>
  </head>

  <body>
    <main class="container notfound">
      <svg class="lost-cam" viewBox="0 0 180 120" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g class="body">
          <rect x="70" y="30" width="24" height="12" rx="3"/>
          <rect x="45" y="40" width="90" height="56" rx="9" fill="#fafaf9"/>
          <circle cx="122" cy="50" r="3" fill="#b45309" stroke="none"/>
          <g class="lens">
            <circle cx="90" cy="66" r="19" fill="#fff"/>
            <circle class="pupil" cx="90" cy="66" r="7" fill="#1c1917" stroke="none"/>
          </g>
          <g class="demo-only">
            <circle cx="90" cy="66" r="19" fill="#fff"/>
            <path d="M78 64 q12 10 24 0"/>
          </g>
        </g>
        <text class="huh notfound-only" x="150" y="38" fill="#b45309" stroke="none" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" text-anchor="middle">?</text>
        <text class="zz demo-only" x="150" y="38" fill="#b45309" stroke="none" font-family="'Cormorant Garamond', Georgia, serif" font-size="26" font-weight="600" text-anchor="middle">z<tspan font-size="18" dy="-10">z</tspan></text>
      </svg>

      <div class="notfound-only">
        <p class="tagline">Error 404</p>
        <h1 class="name">Page not found</h1>
        <p>Pose estimation failed: this page isn't in the reconstruction.</p>
      </div>
      <div class="demo-only">
        <p class="tagline">That's a wrap</p>
        <h1 class="name">The demo is over</h1>
        <p>This concept was online for a limited time and has now been taken down.</p>
        <p lang="it">La demo è terminata. Grazie per averla guardata!</p>
      </div>
      <p>Back to <a href="/">mattiadurso.com</a>.</p>
    </main>
  </body>
</html>
